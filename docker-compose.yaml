services:
  readmore:
    build: .
    container_name: readmore
    # Local dev only: keep the container idle so you exec in manually
    # (docker compose exec readmore python3 server.py). Real hosts run the
    # image's own CMD directly and ignore this file, so they still get the
    # actual server.
    command: ["tail", "-f", "/dev/null"]
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - SHEETS_WEBAPP_URL=${SHEETS_WEBAPP_URL}
      - SHEETS_API_TOKEN=${SHEETS_API_TOKEN}
    restart: unless-stopped
