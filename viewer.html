<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning by Images — Viewer</title>
<style>
  :root {
    --bg: #111318;
    --card: #1a1d24;
    --text: #eef0f3;
    --muted: #8b91a0;
    --accent: #4f8cff;
    --confident: #35c07a;
    --learning: #e0a530;
    --border: #2a2e38;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1a1d24;
      --muted: #666d7a;
      --accent: #2f6fe4;
      --confident: #1f9a5a;
      --learning: #b8790a;
      --border: #e1e3e8;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    gap: 24px;
    min-height: 100vh; padding: 24px;
  }
  .layout {
    display: flex; flex-direction: column;
    gap: 24px;
    width: 100%; max-width: 900px;
  }
  @media (min-width: 960px) {
    .layout { flex-direction: row; align-items: flex-start; }
  }
  .sidebar {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  @media (min-width: 960px) {
    .sidebar { width: 220px; flex-shrink: 0; position: sticky; top: 24px; }
  }
  .sidebar-title {
    font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted);
  }
  .checkbox-row {
    display: flex; align-items: center; gap: 10px;
    font-size: 14px; cursor: pointer; user-select: none;
  }
  #lang-select {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 8px; font-size: 14px; margin-top: -6px;
  }
  .current-user {
    font-size: 13px; color: var(--text);
    word-break: break-all;
    margin-top: -6px;
  }
  .switch-user-btn {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 13px; cursor: pointer;
  }
  .switch-user-btn:hover {
    border-color: var(--accent); color: var(--accent);
  }
  .checkbox-row input[type="checkbox"] {
    width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer;
  }
  .hidden-words-hint {
    font-size: 12px; color: var(--muted); margin-top: -8px;
  }
  .hidden-words-list {
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .hidden-words-empty {
    font-size: 13px; color: var(--muted); font-style: italic;
  }
  .hidden-word-chip {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 12px;
    cursor: pointer;
    color: var(--text);
  }
  .hidden-word-chip:hover {
    border-color: var(--accent); color: var(--accent);
  }
  .main {
    display: flex; flex-direction: column; align-items: center;
    gap: 18px;
    flex: 1; width: 100%; min-width: 0;
  }
  .empty-state {
    display: none;
    width: min(90vw, 640px);
    color: var(--muted); font-size: 14px; text-align: center;
    padding: 60px 20px;
    border: 1px dashed var(--border);
    border-radius: 16px;
  }
  .loading {
    display: none;
    width: min(90vw, 640px);
    flex-direction: column; align-items: center; justify-content: center;
    gap: 14px;
    padding: 60px 20px;
    color: var(--muted); font-size: 14px;
  }
  .spinner {
    width: 30px; height: 30px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    color: var(--muted); font-size: 14px;
  }
  .badge {
    padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .badge.confident { background: color-mix(in srgb, var(--confident) 20%, transparent); color: var(--confident); }
  .badge.learning { background: color-mix(in srgb, var(--learning) 20%, transparent); color: var(--learning); }

  .card {
    width: min(90vw, 640px);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    display: flex; flex-direction: column;
  }
  .sentence-area {
    padding: 18px 24px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .sentence-label {
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted);
  }
  .sentence {
    font-size: 16px; color: var(--text); line-height: 1.4; font-style: italic;
  }
  .image-wrap {
    width: 100%; aspect-ratio: 4 / 3;
    background: repeating-conic-gradient(var(--border) 0% 25%, transparent 0% 50%) 50% / 20px 20px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .image-wrap img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    display: block;
  }
  .missing {
    flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; width: 100%; height: 100%;
    color: var(--muted); font-size: 14px; text-align: center; padding: 24px;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
  }
  .missing-cue-label, .missing-sentence-label {
    display: none;
    font-size: 2px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px;
  }
  .missing-cue {
    font-size: 18px; color: var(--text); line-height: 1.4;
    margin-bottom: 32px;
  }
  .missing-sentence {
    font-size: 24px; color: var(--text); line-height: 1.4;
  }
  .cue-area {
    padding: 18px 24px 0;
    text-align: center;
    border-top: 1px solid var(--border);
  }
  .cue-label {
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px;
  }
  .cue {
    font-size: 15px; color: var(--text); line-height: 1.4;
  }
  .word-area {
    padding: 20px 24px 24px;
    text-align: center;
  }
  .label-row {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 6px;
  }
  .response-label {
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted);
  }
  .speak-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; padding: 0;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 23px; cursor: pointer;
  }
  .speak-btn:hover {
    border-color: var(--accent); color: var(--accent);
  }
  .speak-btn:disabled {
    opacity: 0.4; cursor: not-allowed;
  }
  .word {
    font-size: 28px; font-weight: 700;
    min-height: 38px;
    cursor: pointer;
    user-select: none;
  }
  .word.hidden-word {
    filter: blur(10px);
    opacity: 0.5;
  }
  .hint {
    margin-top: 10px; font-size: 13px; color: var(--muted);
  }
  .controls {
    display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 16px;
    color: var(--muted); font-size: 13px;
  }
  kbd {
    background: var(--card); border: 1px solid var(--border);
    border-bottom-width: 2px; border-radius: 6px;
    padding: 2px 7px; font-size: 12px; font-family: inherit; color: var(--text);
  }
  .action-bar {
    width: min(90vw, 640px);
    display: flex; align-items: stretch; gap: 10px;
  }
  .action-btn {
    flex: 1;
    min-height: 48px;
    background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px;
    font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  .action-btn:hover {
    border-color: var(--accent); color: var(--accent);
  }
  .action-btn-icon {
    flex: 0 0 56px;
    font-size: 18px;
  }
  .action-btn-primary {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .action-btn-primary:hover {
    opacity: 0.9; color: #fff;
  }
  .progress {
    width: min(90vw, 640px); height: 4px; background: var(--border);
    border-radius: 2px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: var(--accent); width: 0%;
    transition: width 0.15s ease;
  }
  .error-banner {
    display: none;
    width: min(90vw, 640px);
    background: color-mix(in srgb, #e0453a 15%, transparent);
    border: 1px solid #e0453a;
    color: #e0453a;
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 13px;
    line-height: 1.5;
  }
  .error-banner code {
    background: rgba(0,0,0,0.15);
    padding: 1px 5px;
    border-radius: 4px;
  }

  .global-topbar {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
    width: 100%; max-width: 900px;
  }
  .global-topbar-user {
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap;
  }
  .topbar-user-email {
    font-size: 13px; color: var(--text);
    word-break: break-all;
  }
  #topic-flashcards-panel, #topic-texts-panel {
    display: flex; justify-content: center;
    width: 100%;
  }
  .tabs {
    display: flex; gap: 8px;
    width: 100%; max-width: 900px;
  }
  .tab-btn {
    background: transparent; color: var(--muted);
    border: none; border-bottom: 2px solid transparent;
    padding: 8px 4px; font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  .tab-btn:hover {
    color: var(--text);
  }
  .tab-btn.active {
    color: var(--text); border-bottom-color: var(--accent);
  }

  .texts-page {
    display: flex; flex-direction: column; align-items: center;
    gap: 18px;
    width: 100%; max-width: 900px;
  }
  #topic-workspace {
    display: flex; flex-direction: column; align-items: center;
    gap: 18px;
    width: 100%;
  }
  .breadcrumb {
    width: 100%;
    font-size: 13px; color: var(--muted);
  }
  .breadcrumb button {
    background: none; border: none; padding: 0;
    color: var(--muted); font-size: 13px; cursor: pointer;
    text-decoration: underline;
  }
  .breadcrumb button:hover {
    color: var(--accent);
  }
  .breadcrumb .sep {
    margin: 0 6px;
  }
  .breadcrumb .current {
    color: var(--text);
  }
  .item-list {
    display: flex; flex-direction: column; gap: 12px;
    width: 100%;
  }
  .item-card {
    display: block; width: 100%; text-align: left;
    background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px;
    cursor: pointer;
  }
  .item-card:hover {
    border-color: var(--accent);
  }
  .item-card-title {
    font-size: 16px; font-weight: 700;
  }
  .item-card-description {
    margin-top: 4px;
    font-size: 13px; color: var(--muted); line-height: 1.4;
  }
  .text-reader {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 24px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .text-reader-number {
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted);
  }
  .text-reader-title {
    margin: 4px 0 0; font-size: 20px;
  }
  .text-reader-body {
    font-size: 17px; line-height: 1.8; color: var(--text);
  }
  .text-reader-body p {
    margin: 0 0 14px;
  }
  .text-reader-body p:last-child {
    margin-bottom: 0;
  }
  .text-reader-body strong {
    color: var(--accent);
  }
</style>
</head>
<body>

  <div class="global-topbar" id="global-topbar">
    <div class="global-topbar-user">
      <span class="topbar-user-email" id="current-user-email"></span>
      <button type="button" class="switch-user-btn" id="switch-user-btn">Log in with another email</button>
    </div>
    <select id="lang-select"></select>
  </div>

  <div class="texts-page">
    <div class="breadcrumb" id="texts-breadcrumb"></div>

    <div class="error-banner" id="texts-error-banner"></div>

    <div class="loading" id="texts-loading">
      <div class="spinner"></div>
      <div>Loading chapters…</div>
    </div>

    <div class="empty-state" id="texts-empty-state">No chapters available yet.</div>

    <div class="item-list" id="chapters-list" style="display:none"></div>

    <div class="item-list" id="topics-list" style="display:none"></div>

    <div id="topic-workspace" style="display:none">
      <div class="tabs" id="topic-tabs">
        <button type="button" class="tab-btn active" id="topic-tab-flashcards" data-tab="flashcards">Flashcards</button>
        <button type="button" class="tab-btn" id="topic-tab-texts" data-tab="texts">Texts</button>
      </div>

      <div id="topic-flashcards-panel">
        <div class="layout">
          <aside class="sidebar">
            <div class="sidebar-title">Filter</div>
            <label class="checkbox-row">
              <input type="checkbox" id="filter-confident" checked>
              <span>Confident words</span>
            </label>
            <label class="checkbox-row">
              <input type="checkbox" id="filter-learning" checked>
              <span>Learning words</span>
            </label>

            <div class="sidebar-title">Hidden words</div>
            <div class="hidden-words-hint">Click a word to show it again</div>
            <div class="hidden-words-list" id="hidden-words-list"></div>
          </aside>

          <main class="main">
            <div class="topbar">
              <span id="counter">1 / 1</span>
              <span class="badge confident" id="badge">confident</span>
            </div>

            <div class="error-banner" id="error-banner"></div>

            <div class="loading" id="loading">
              <div class="spinner"></div>
              <div>Loading your words…</div>
            </div>

            <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>

            <div class="card" id="card">
              <div class="sentence-area">
                <div class="label-row">
                  <div class="sentence-label">Sentence</div>
                  <button type="button" class="speak-btn" id="speak-sentence-btn" title="Play sentence" aria-label="Play sentence">🔊</button>
                </div>
                <div class="sentence" id="sentence"></div>
              </div>
              <div class="image-wrap">
                <img id="img" alt="">
                <div class="missing" id="missing">
                  <div>
                    <div class="missing-cue-label">Cue</div>
                    <div class="missing-cue" id="missing-cue"></div>
                  </div>
                  <div>
                    <div class="label-row">
                      <div class="missing-sentence-label">Sentence</div>
                      <button type="button" class="speak-btn" id="speak-missing-sentence-btn" title="Play sentence" aria-label="Play sentence">🔊</button>
                    </div>
                    <div class="missing-sentence" id="missing-sentence"></div>
                  </div>
                </div>
              </div>
              <div class="cue-area">
                <div class="cue-label">Cue</div>
                <div class="cue" id="cue"></div>
              </div>
              <div class="word-area">
                <div class="label-row">
                  <div class="response-label">Response</div>
                  <button type="button" class="speak-btn" id="speak-btn" title="Play pronunciation" aria-label="Play pronunciation">🔊</button>
                </div>
                <div class="word hidden-word" id="word">•••••</div>
                <div class="hint">click word to reveal</div>
              </div>
            </div>

            <div class="empty-state" id="empty-state">No words match the selected filters.</div>

            <div class="controls">
              <span><kbd>←</kbd> <kbd>→</kbd> browse</span>
              <span><kbd>space</kbd> mark shown + next</span>
              <span><kbd>enter</kbd> I know this + next</span>
            </div>

            <div class="action-bar" id="action-bar">
              <button type="button" class="action-btn action-btn-icon" id="prev-btn" title="Previous word" aria-label="Previous word">←</button>
              <button type="button" class="action-btn" id="know-btn">I know</button>
              <button type="button" class="action-btn action-btn-primary" id="next-word-btn">Next</button>
              <button type="button" class="action-btn action-btn-icon" id="next-btn" title="Next word" aria-label="Next word">→</button>
            </div>
          </main>
        </div>
      </div>

      <div id="topic-texts-panel" style="display:none">
        <div class="text-reader" id="text-reader">
          <div>
            <div class="text-reader-number" id="text-reader-number"></div>
            <h2 class="text-reader-title" id="text-reader-title"></h2>
          </div>
          <div class="text-reader-body" id="text-reader-body"></div>
          <div class="action-bar">
            <button type="button" class="action-btn action-btn-icon" id="text-prev-btn" title="Previous text" aria-label="Previous text">←</button>
            <button type="button" class="action-btn action-btn-icon" id="text-next-btn" title="Next text" aria-label="Next text">→</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>

  const EXT_FALLBACKS = ["png", "jpg", "jpeg", "webp", "gif", "jfif"];
  const EMAIL_STORAGE_KEY = "readmore_user_email";
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  // /data and /chapters are both backed by Google Sheets on the server side,
  // which occasionally has a slow/failed round trip even after the server's
  // own retries are exhausted. One extra client-side retry clears most of
  // those without the user having to notice or reload manually.
  async function fetchJsonWithRetry(url, attempts = 2) {
    let lastErr;
    for (let attempt = 0; attempt < attempts; attempt++) {
      try {
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error(`${url} responded with ${res.status}`);
        return await res.json();
      } catch (err) {
        lastErr = err;
        if (attempt < attempts - 1) await new Promise((r) => setTimeout(r, 1500));
      }
    }
    throw lastErr;
  }

  let USER_EMAIL = null;
  let LANG = "english";
  let ALL_ENTRIES = [];
  let ENTRIES = [];
  let HIDDEN_ENTRIES = [];
  let index = 0;
  let revealed = false;

  const langSelectEl = document.getElementById("lang-select");
  const currentUserEmailEl = document.getElementById("current-user-email");
  const switchUserBtn = document.getElementById("switch-user-btn");

  function promptForEmail(message) {
    let email = null;
    while (!email || !EMAIL_RE.test(email)) {
      email = window.prompt(message);
      if (email === null) continue; // keep asking, there's no usable default
      email = email.trim();
    }
    return email;
  }

  function setUserEmail(email) {
    USER_EMAIL = email;
    localStorage.setItem(EMAIL_STORAGE_KEY, email);
    currentUserEmailEl.textContent = email;
  }

  function getUserEmail() {
    const stored = localStorage.getItem(EMAIL_STORAGE_KEY);
    if (stored && EMAIL_RE.test(stored)) return stored;
    return promptForEmail("Enter your email to load your word list:");
  }

  async function switchUser() {
    const email = promptForEmail("Enter the email to log in with:");
    setUserEmail(email);
    await loadAndRenderChapters();
  }

  switchUserBtn.addEventListener("click", switchUser);

  async function loadLanguages() {
    const res = await fetch("/languages", { cache: "no-store" });
    if (!res.ok) throw new Error(`/languages responded with ${res.status}`);
    const data = await res.json();
    return data.languages || [];
  }

  const img = document.getElementById("img");
  const missing = document.getElementById("missing");
  const missingCueEl = document.getElementById("missing-cue");
  const missingSentenceEl = document.getElementById("missing-sentence");
  const wordEl = document.getElementById("word");
  const cueEl = document.getElementById("cue");
  const sentenceEl = document.getElementById("sentence");
  const sentenceAreaEl = document.querySelector(".sentence-area");
  const cueAreaEl = document.querySelector(".cue-area");
  const counterEl = document.getElementById("counter");
  const badgeEl = document.getElementById("badge");
  const progressFill = document.getElementById("progress-fill");
  const errorBanner = document.getElementById("error-banner");
  const loadingEl = document.getElementById("loading");
  const cardEl = document.getElementById("card");
  const controlsEl = document.querySelector(".controls");
  const actionBarEl = document.getElementById("action-bar");
  const prevBtn = document.getElementById("prev-btn");
  const nextBtn = document.getElementById("next-btn");
  const knowBtn = document.getElementById("know-btn");
  const nextWordBtn = document.getElementById("next-word-btn");
  const progressEl = document.querySelector(".progress");
  const emptyStateEl = document.getElementById("empty-state");
  const filterConfidentEl = document.getElementById("filter-confident");
  const filterLearningEl = document.getElementById("filter-learning");
  const hiddenListEl = document.getElementById("hidden-words-list");
  const speakBtn = document.getElementById("speak-btn");
  const speakSentenceBtn = document.getElementById("speak-sentence-btn");
  const speakMissingSentenceBtn = document.getElementById("speak-missing-sentence-btn");

  const SPEECH_SUPPORTED = "speechSynthesis" in window;

  function speakWordLocal(text) {
    if (!SPEECH_SUPPORTED || !text) return;
    window.speechSynthesis.cancel(); // stop anything already speaking
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "en-US";
    window.speechSynthesis.speak(utterance);
  }

  function speakWord(text) {
    if (!text) return;
    const url = `/tts?text=${encodeURIComponent(text)}`;
    const audio = new Audio(url);
    audio.addEventListener("error", () => {
      console.warn("TTS proxy unavailable (is server.py running?), falling back to local speech synthesis.");
      speakWordLocal(text);
    });
    audio.play().catch(() => {
      console.warn("TTS playback blocked/failed, falling back to local speech synthesis.");
      speakWordLocal(text);
    });
  }

  speakBtn.addEventListener("click", () => {
    if (ENTRIES.length === 0) return;
    speakWord(ENTRIES[index].word);
  });

  function speakCurrentSentence() {
    if (ENTRIES.length === 0) return;
    const entry = ENTRIES[index];
    const filledSentence = entry.sentence.replace(/_+/g, entry.word);
    speakWord(filledSentence);
  }

  speakSentenceBtn.addEventListener("click", speakCurrentSentence);
  speakMissingSentenceBtn.addEventListener("click", speakCurrentSentence);

  async function loadEntries() {
    const url = `/data?user=${encodeURIComponent(USER_EMAIL)}&lang=${encodeURIComponent(LANG)}`;
    const data = await fetchJsonWithRetry(url);

    const entries = data.words.map((e) => {
      const dot = e.filename.lastIndexOf(".");
      const base = dot >= 0 ? e.filename.slice(0, dot) : e.filename;
      const ext = dot >= 0 ? e.filename.slice(dot + 1) : "png";
      return {
        wordId: e.word_id,
        word: e.original,
        base,
        ext,
        confident: e.confident,
        cue: e.cue || "",
        sentence: e.sentence || "",
        shownCount: e.shown_count || 0,
        show: e.show !== false,
      };
    });

    entries.sort((a, b) => a.shownCount - b.shownCount);
    return entries;
  }

  function showError(err) {
    console.error(err);
    errorBanner.style.display = "block";
    errorBanner.innerHTML =
      `Couldn't load your word list (${err.message}).<br>` +
      `Make sure <code>server.py</code> is running and you opened this page via ` +
      `<code>http://127.0.0.1:PORT/viewer.html</code>, not a <code>file://</code> path.`;
  }

  function setLoading(isLoading) {
    loadingEl.style.display = isLoading ? "flex" : "none";
    if (isLoading) {
      errorBanner.style.display = "none";
      cardEl.style.display = "none";
      progressEl.style.display = "none";
      controlsEl.style.display = "none";
      actionBarEl.style.display = "none";
      emptyStateEl.style.display = "none";
      badgeEl.style.display = "none";
    }
  }

  function extCandidates(entry) {
    const list = [entry.ext, ...EXT_FALLBACKS];
    return [...new Set(list)];
  }

  function loadImage(entry) {
    const candidates = extCandidates(entry);
    let i = 0;

    img.style.display = "block";
    missing.style.display = "none";
    sentenceAreaEl.style.display = "block";
    cueAreaEl.style.display = "block";

    function tryNext() {
      if (i >= candidates.length) {
        img.style.display = "none";
        missing.style.display = "flex";
        sentenceAreaEl.style.display = "none";
        cueAreaEl.style.display = "none";
        missingCueEl.textContent = entry.cue;
        missingSentenceEl.textContent = entry.sentence;
        return;
      }
      const ext = candidates[i];
      i++;
      img.onerror = tryNext;
      img.src = `images/${entry.base}.${ext}`;
    }
    tryNext();
  }

  function applyFilter() {
    const showConfident = filterConfidentEl.checked;
    const showLearning = filterLearningEl.checked;
    const topicWordIds = currentTopic ? new Set(currentTopic.word_ids) : null;

    ENTRIES = ALL_ENTRIES.filter((e) => {
      if (topicWordIds && !topicWordIds.has(e.wordId)) return false;
      return (e.confident && showConfident) || (!e.confident && showLearning);
    });
    index = 0;
    updateVisibility();
  }

  function updateVisibility() {
    if (ENTRIES.length === 0) {
      cardEl.style.display = "none";
      progressEl.style.display = "none";
      controlsEl.style.display = "none";
      actionBarEl.style.display = "none";
      emptyStateEl.style.display = "block";
      counterEl.textContent = "0 / 0";
      badgeEl.style.display = "none";
    } else {
      cardEl.style.display = "flex";
      progressEl.style.display = "block";
      controlsEl.style.display = "flex";
      actionBarEl.style.display = "flex";
      emptyStateEl.style.display = "none";
      badgeEl.style.display = "inline";
      render();
    }
  }

  function render() {
    if (ENTRIES.length === 0) return;
    const entry = ENTRIES[index];
    loadImage(entry);

    sentenceEl.textContent = entry.sentence;
    cueEl.textContent = entry.cue;

    revealed = false;
    wordEl.textContent = entry.word;
    wordEl.classList.add("hidden-word");

    counterEl.textContent = `${index + 1} / ${ENTRIES.length}`;
    badgeEl.textContent = entry.confident ? "confident" : "learning";
    badgeEl.className = "badge " + (entry.confident ? "confident" : "learning");

    progressFill.style.width = `${((index + 1) / ENTRIES.length) * 100}%`;
  }

  function recordShown(entry) {
    fetch("/increment", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user: USER_EMAIL, lang: LANG, word_id: entry.wordId }),
    }).catch((err) => {
      console.warn("Couldn't record shown_count (is server.py running?):", err);
    });
  }

  function next() {
    if (ENTRIES.length === 0) return;
    index = (index + 1) % ENTRIES.length;
    render();
  }
  function prev() {
    if (ENTRIES.length === 0) return;
    index = (index - 1 + ENTRIES.length) % ENTRIES.length;
    render();
  }
  function toggleReveal() {
    revealed = !revealed;
    wordEl.classList.toggle("hidden-word", !revealed);
  }

  function markShownAndAdvance() {
    if (ENTRIES.length === 0) return;
    recordShown(ENTRIES[index]);
    next();
  }

  function markKnownAndAdvance() {
    if (ENTRIES.length === 0) return;
    const entry = ENTRIES[index];

    fetch("/mark-known", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user: USER_EMAIL, lang: LANG, word_id: entry.wordId }),
    }).catch((err) => {
      console.warn("Couldn't mark word as known (is server.py running?):", err);
    });

    entry.show = false;
    ALL_ENTRIES = ALL_ENTRIES.filter((e) => e.word !== entry.word);
    ENTRIES = ENTRIES.filter((e) => e.word !== entry.word);
    HIDDEN_ENTRIES.push(entry);
    HIDDEN_ENTRIES.sort((a, b) => a.word.toLowerCase().localeCompare(b.word.toLowerCase()));
    renderHiddenList();
    if (index >= ENTRIES.length) index = 0;
    updateVisibility();
  }

  function unhideWord(entry) {
    fetch("/show-word", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user: USER_EMAIL, lang: LANG, word_id: entry.wordId }),
    }).catch((err) => {
      console.warn("Couldn't show word again (is server.py running?):", err);
    });

    entry.show = true;
    HIDDEN_ENTRIES = HIDDEN_ENTRIES.filter((e) => e.word !== entry.word);
    ALL_ENTRIES.push(entry);
    ALL_ENTRIES.sort((a, b) => a.shownCount - b.shownCount);
    renderHiddenList();
    applyFilter();
  }

  function renderHiddenList() {
    hiddenListEl.innerHTML = "";
    const topicWordIds = currentTopic ? new Set(currentTopic.word_ids) : null;
    const visible = topicWordIds ? HIDDEN_ENTRIES.filter((e) => topicWordIds.has(e.wordId)) : HIDDEN_ENTRIES;
    if (visible.length === 0) {
      const empty = document.createElement("div");
      empty.className = "hidden-words-empty";
      empty.textContent = "No hidden words yet.";
      hiddenListEl.appendChild(empty);
      return;
    }
    for (const entry of visible) {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "hidden-word-chip";
      chip.textContent = entry.word;
      chip.title = "Click to show this word again";
      chip.addEventListener("click", () => unhideWord(entry));
      hiddenListEl.appendChild(chip);
    }
  }

  wordEl.addEventListener("click", toggleReveal);

  prevBtn.addEventListener("click", prev);
  nextBtn.addEventListener("click", next);
  knowBtn.addEventListener("click", markKnownAndAdvance);
  nextWordBtn.addEventListener("click", markShownAndAdvance);

  window.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); next(); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); prev(); }
    else if (e.key === " ") { e.preventDefault(); markShownAndAdvance(); }
    else if (e.key === "Enter") { e.preventDefault(); markKnownAndAdvance(); }
  });

  function handleFilterChange(e) {
    if (!filterConfidentEl.checked && !filterLearningEl.checked) {
      e.target.checked = true; // don't allow turning both off
      return;
    }
    applyFilter();
  }

  filterConfidentEl.addEventListener("change", handleFilterChange);
  filterLearningEl.addEventListener("change", handleFilterChange);

  async function loadAndRenderEntries() {
    setLoading(true);
    try {
      const entries = await loadEntries();
      ALL_ENTRIES = entries.filter((e) => e.show);
      HIDDEN_ENTRIES = entries.filter((e) => !e.show);
      HIDDEN_ENTRIES.sort((a, b) => a.word.toLowerCase().localeCompare(b.word.toLowerCase()));
      renderHiddenList();
      applyFilter();
    } finally {
      setLoading(false);
    }
  }

  langSelectEl.addEventListener("change", () => {
    LANG = langSelectEl.value;
    loadAndRenderChapters();
  });

  // ---- Topic workspace tabs (Flashcards / Texts within a topic) ----

  let currentTopicTab = "flashcards";
  const topicWorkspaceEl = document.getElementById("topic-workspace");
  const topicTabFlashcardsBtn = document.getElementById("topic-tab-flashcards");
  const topicTabTextsBtn = document.getElementById("topic-tab-texts");
  const topicFlashcardsPanelEl = document.getElementById("topic-flashcards-panel");
  const topicTextsPanelEl = document.getElementById("topic-texts-panel");

  function switchTopicTab(tab) {
    currentTopicTab = tab;
    topicTabFlashcardsBtn.classList.toggle("active", tab === "flashcards");
    topicTabTextsBtn.classList.toggle("active", tab === "texts");
    topicFlashcardsPanelEl.style.display = tab === "flashcards" ? "flex" : "none";
    topicTextsPanelEl.style.display = tab === "texts" ? "flex" : "none";
    if (tab === "flashcards") {
      loadAndRenderEntries().catch(showError);
    } else {
      currentTextIndex = 0;
      renderCurrentText();
    }
  }

  topicTabFlashcardsBtn.addEventListener("click", () => switchTopicTab("flashcards"));
  topicTabTextsBtn.addEventListener("click", () => switchTopicTab("texts"));

  // ---- Texts ----

  let CHAPTERS = [];
  let currentChapter = null;
  let currentTopic = null;
  let currentTextIndex = 0;

  const textsBreadcrumbEl = document.getElementById("texts-breadcrumb");
  const textsErrorBanner = document.getElementById("texts-error-banner");
  const textsLoadingEl = document.getElementById("texts-loading");
  const textsEmptyStateEl = document.getElementById("texts-empty-state");
  const chaptersListEl = document.getElementById("chapters-list");
  const topicsListEl = document.getElementById("topics-list");
  const textReaderNumberEl = document.getElementById("text-reader-number");
  const textReaderTitleEl = document.getElementById("text-reader-title");
  const textReaderBodyEl = document.getElementById("text-reader-body");
  const textPrevBtn = document.getElementById("text-prev-btn");
  const textNextBtn = document.getElementById("text-next-btn");

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function renderTextBody(body) {
    return body
      .split("\n")
      .map((line) => `<p>${escapeHtml(line).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")}</p>`)
      .join("");
  }

  function showTextsError(err) {
    console.error(err);
    textsErrorBanner.style.display = "block";
    textsErrorBanner.innerHTML = `Couldn't load chapters (${err.message}).`;
  }

  async function fetchChapters() {
    const url = `/chapters?user=${encodeURIComponent(USER_EMAIL)}&lang=${encodeURIComponent(LANG)}`;
    const data = await fetchJsonWithRetry(url);
    return data.chapters || [];
  }

  async function loadAndRenderChapters() {
    textsErrorBanner.style.display = "none";
    textsEmptyStateEl.style.display = "none";
    chaptersListEl.style.display = "none";
    topicsListEl.style.display = "none";
    topicWorkspaceEl.style.display = "none";
    textsLoadingEl.style.display = "flex";
    try {
      CHAPTERS = await fetchChapters();
      currentChapter = null;
      currentTopic = null;
      renderChaptersList();
    } catch (err) {
      showTextsError(err);
    } finally {
      textsLoadingEl.style.display = "none";
    }
  }

  function renderBreadcrumb() {
    textsBreadcrumbEl.innerHTML = "";

    const chaptersBtn = document.createElement("button");
    chaptersBtn.type = "button";
    chaptersBtn.textContent = "Chapters";
    chaptersBtn.addEventListener("click", renderChaptersList);
    textsBreadcrumbEl.appendChild(chaptersBtn);

    if (!currentChapter) return;

    textsBreadcrumbEl.appendChild(sepEl());
    if (!currentTopic) {
      textsBreadcrumbEl.appendChild(currentSpan(currentChapter.title));
      return;
    }

    const chapterBtn = document.createElement("button");
    chapterBtn.type = "button";
    chapterBtn.textContent = currentChapter.title;
    chapterBtn.addEventListener("click", () => showTopics(currentChapter));
    textsBreadcrumbEl.appendChild(chapterBtn);

    textsBreadcrumbEl.appendChild(sepEl());
    textsBreadcrumbEl.appendChild(currentSpan(currentTopic.title));
  }

  function sepEl() {
    const sep = document.createElement("span");
    sep.className = "sep";
    sep.textContent = "›";
    return sep;
  }

  function currentSpan(text) {
    const span = document.createElement("span");
    span.className = "current";
    span.textContent = text;
    return span;
  }

  function itemCard(number, title, description, onClick) {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "item-card";
    card.innerHTML =
      `<div class="item-card-title">${number}. ${escapeHtml(title)}</div>` +
      (description ? `<div class="item-card-description">${escapeHtml(description)}</div>` : "");
    card.addEventListener("click", onClick);
    return card;
  }

  function renderChaptersList() {
    currentChapter = null;
    currentTopic = null;
    renderBreadcrumb();

    topicsListEl.style.display = "none";
    topicWorkspaceEl.style.display = "none";
    chaptersListEl.innerHTML = "";

    if (CHAPTERS.length === 0) {
      chaptersListEl.style.display = "none";
      textsEmptyStateEl.style.display = "block";
      return;
    }
    textsEmptyStateEl.style.display = "none";
    chaptersListEl.style.display = "flex";

    for (const chapter of CHAPTERS) {
      chaptersListEl.appendChild(
        itemCard(chapter.number, chapter.title, chapter.description, () => showTopics(chapter))
      );
    }
  }

  function showTopics(chapter) {
    currentChapter = chapter;
    currentTopic = null;
    renderBreadcrumb();

    chaptersListEl.style.display = "none";
    topicWorkspaceEl.style.display = "none";
    textsEmptyStateEl.style.display = "none";
    topicsListEl.innerHTML = "";
    topicsListEl.style.display = "flex";

    for (const topic of chapter.topics) {
      topicsListEl.appendChild(
        itemCard(topic.number, topic.title, topic.description, () => showTopicWorkspace(topic))
      );
    }
  }

  function showTopicWorkspace(topic) {
    currentTopic = topic;
    renderBreadcrumb();

    chaptersListEl.style.display = "none";
    topicsListEl.style.display = "none";
    topicWorkspaceEl.style.display = "flex";

    switchTopicTab("flashcards");
  }

  function renderCurrentText() {
    const text = currentTopic.texts[currentTextIndex];
    textReaderNumberEl.textContent = `Text ${text.number}`;
    textReaderTitleEl.textContent = text.title;
    textReaderBodyEl.innerHTML = renderTextBody(text.body);

    textPrevBtn.disabled = currentTextIndex === 0;
    textNextBtn.disabled = currentTextIndex === currentTopic.texts.length - 1;
  }

  textPrevBtn.addEventListener("click", () => {
    if (currentTextIndex > 0) {
      currentTextIndex--;
      renderCurrentText();
    }
  });
  textNextBtn.addEventListener("click", () => {
    if (currentTextIndex < currentTopic.texts.length - 1) {
      currentTextIndex++;
      renderCurrentText();
    }
  });

  async function init() {
    try {
      setUserEmail(getUserEmail());

      const languages = await loadLanguages();
      langSelectEl.innerHTML = "";
      for (const lang of languages) {
        const opt = document.createElement("option");
        opt.value = lang;
        opt.textContent = lang[0].toUpperCase() + lang.slice(1);
        langSelectEl.appendChild(opt);
      }
      LANG = languages.includes(LANG) ? LANG : (languages[0] || LANG);
      langSelectEl.value = LANG;

      await loadAndRenderChapters();
    } catch (err) {
      showTextsError(err);
    }
  }

  init();
</script>
</body>
</html>
